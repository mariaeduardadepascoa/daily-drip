<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Daily Drip</title>
</head>
<body>
    <div class="header">
        <h1 class="title">Daily Drip</h1>
        <img src="imgs/daily_drip_logo2.png" alt="Logo Daily Drip">
    </div>
    <div class="mainContent">

        <div class="containerSwitch">
            <button class="todayTasksButton">Today</button>
            <button class="doneTasksButton">Done</button>
        </div>

        <ul id="todoList"></ul>
        
        <input id="taskInput" class="off" type="text" placeholder="Write A New Task Here">
        <button id="addTaskBtn">+ Add Task</button>
    </div>





    <script src="popup.js"></script>
</body>
</html>
